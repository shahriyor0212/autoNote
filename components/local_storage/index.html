<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    function sendMessage(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
    }

    function init() {
      sendMessage("streamlit:componentReady", { apiVersion: 1 });
      sendMessage("streamlit:setFrameHeight", { height: 0 });
    }

    function getStorage() {
      try {
        if (window.parent && window.parent.localStorage) {
          return window.parent.localStorage;
        }
      } catch (e) {}
      try {
        return window.localStorage;
      } catch (e) {
        return null;
      }
    }

    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "streamlit:render") {
        const storage = getStorage();
        const action = event.data.args ? event.data.args.action : "read";
        const keyVal = event.data.args ? event.data.args.key_value : "";

        if (storage) {
          if (action === "save" && keyVal) {
            try { storage.setItem("gemini_api_key", keyVal); } catch(e) {}
          } else if (action === "clear") {
            try { storage.removeItem("gemini_api_key"); } catch(e) {}
          }
        }

        let saved = "";
        if (storage) {
          try { saved = storage.getItem("gemini_api_key") || ""; } catch(e) {}
        }

        sendMessage("streamlit:setComponentValue", { value: saved });
        sendMessage("streamlit:setFrameHeight", { height: 0 });
      }
    });

    window.addEventListener("load", init);
  </script>
</head>
<body style="margin: 0; padding: 0; height: 0; overflow: hidden; background: transparent;"></body>
</html>
